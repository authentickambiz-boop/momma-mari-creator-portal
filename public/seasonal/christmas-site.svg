<style>
  .snow-fall { animation: snow-fall 16s linear infinite; }
  .snow-fall.b { animation-duration: 21s; animation-delay: -7s; }
  .snow-fall.c { animation-duration: 13s; animation-delay: -3s; }
  .light-twinkle { animation: light-twinkle 1.8s ease-in-out infinite; }
  @keyframes snow-fall { 0% { transform: translate3d(0, -30px, 0); } 100% { transform: translate3d(12px, 180px, 0); } }
  @keyframes light-twinkle { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .snow-fall, .light-twinkle { animation: none; }
  }
</style>
