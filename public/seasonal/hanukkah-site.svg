<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none" id="scene-site">
  <style>
    .sparkle-twinkle { animation: sparkle-twinkle 2.8s ease-in-out infinite; }
    .sparkle-twinkle.b { animation-duration: 3.6s; animation-delay: -1.2s; }
    .sparkle-twinkle.c { animation-duration: 2.2s; animation-delay: -0.6s; }
    .dreidel-wobble { transform-box: fill-box; transform-origin: center; animation: dreidel-wobble 5.4s ease-in-out infinite; }
    .dreidel-wobble.b { animation-duration: 6.8s; animation-delay: -2s; }
    .dreidel-wobble.c { animation-duration: 4.6s; animation-delay: -1s; }
    @keyframes sparkle-twinkle { 0%, 100% { opacity: 0.28; } 50% { opacity: 1; } }
    @keyframes dreidel-wobble { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(8deg); } }
    @media (prefers-reduced-motion: reduce) {
      .sparkle-twinkle, .dreidel-wobble { animation: none; }
    }
  </style>
