<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" fill="none" id="scene-mobile">
  <style>
    .sparkle-twinkle { animation: sparkle-twinkle 2.8s ease-in-out infinite; }
    .sparkle-twinkle.b { animation-delay: -1s; }
    .dreidel-wobble { transform-box: fill-box; transform-origin: center; animation: dreidel-wobble 5s ease-in-out infinite; }
    @keyframes sparkle-twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    @keyframes dreidel-wobble { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(7deg); } }
    @media (prefers-reduced-motion: reduce) {
      .sparkle-twinkle, .dreidel-wobble { animation: none; }
    }
  </style>
  <rect width="800" height="1200" fill="#071428"/>
