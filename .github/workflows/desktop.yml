name: Desktop installers

# Pushes to main and workflow_dispatch publish worlds-v<version> when TAURI_SIGNING_PRIVATE_KEY is set.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  release:
    types: [published]

jobs:
  build:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          - os: macos-latest
            args: --bundles dmg --target universal-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Apple universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Read the app version
        id: version
        shell: bash
        run: echo "value=$(jq -r .version desktop/src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Updater signing key
        id: signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "TAURI_SIGNING_PRIVATE_KEY is not set, so this build will not publish a signed update."
          fi

      - name: Build Momma Mari Worlds
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}${{ steps.signing.outputs.sign == 'true' && '' || ' --config updater-unsigned.json' }}
          tagName: ${{ (steps.signing.outputs.sign == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && matrix.os == 'windows-latest') && 'worlds-v__VERSION__' || '' }}
          releaseName: Momma Mari Worlds v__VERSION__
          releaseBody: The app checks https://www.mommamari.com/portal/api/desktop/latest.json and installs a newer signed build on its own.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: momma-mari-worlds-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Attach the Mac disk image to the Worlds release
        if: steps.signing.outputs.sign == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: worlds-v${{ steps.version.outputs.value }}
          files: |
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Attach installer to the GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
